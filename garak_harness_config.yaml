system:
  parallel_attempts: 8
  lite: false

run:
  generations: 1

plugins:
  target_type: "rest.RestGenerator"
  generators:
    rest:
      RestGenerator:
        uri: "http://127.0.0.1:8765/v1/chat/completions"
        method: "POST"
        request_timeout: 30
        headers:
          Content-Type: "application/json"
        req_template_json_object:
          model: "defended"
          messages:
            - role: "user"
              content: "%prompt%"
        response_json: true
        response_json_field: "$.choices[0].message.content"
  probe_spec: "promptinject"
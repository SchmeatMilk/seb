<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <title>SEB Security — Free AI risk assessment</title>
  <style type="text/css">
    /* Reset & Base */
    body, table, td, p, a, li, blockquote {
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }
    table, td {
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }
    img {
      -ms-interpolation-mode: bicubic;
      border: 0;
      height: auto;
      line-height: 100%;
      outline: none;
      text-decoration: none;
    }

    /* Design Tokens */
    :root {
      --color-bg: #F8FAFC;
      --color-card: #FFFFFF;
      --color-text: #1E293B;
      --color-text-muted: #64748B;
      --color-brand: #0B1220;
      --color-accent: #00D4AA;
      --color-accent-hover: #00B894;
      --color-warning: #F5A623;
      --color-error: #EF4444;
      --color-border: #E2E8F0;
      --color-focus: #3B82F6;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --space-1: 8px;
      --space-2: 16px;
      --space-3: 24px;
      --space-4: 32px;
      --space-5: 48px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.1), 0 2px 4px -2px rgba(15, 23, 42, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.1), 0 4px 6px -4px rgba(15, 23, 42, 0.1);
    }

    /* Typography Scale */
    .text-xs { font-size: 12px; line-height: 1.5; }
    .text-sm { font-size: 14px; line-height: 1.5; }
    .text-base { font-size: 16px; line-height: 1.6; }
    .text-lg { font-size: 18px; line-height: 1.5; }
    .text-xl { font-size: 20px; line-height: 1.4; }
    .text-2xl { font-size: 24px; line-height: 1.3; }
    .text-3xl { font-size: 28px; line-height: 1.2; }

    .font-normal { font-weight: 400; }
    .font-medium { font-weight: 500; }
    .font-semibold { font-weight: 600; }
    .font-bold { font-weight: 700; }

    /* Layout */
    .container { width: 100%; max-width: 600px; margin: 0 auto; }
    .wrapper { background-color: var(--color-bg); padding: var(--space-4) var(--space-2); }
    .card { background-color: var(--color-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); overflow: hidden; }
    .section { padding: var(--space-3) var(--space-4); }
    .section--tight { padding-top: var(--space-2); padding-bottom: var(--space-2); }

    /* Divider */
    .divider {
      height: 1px;
      background-color: var(--color-border);
      margin: var(--space-3) 0;
    }

    /* Button */
    .btn {
      display: inline-block;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;
      text-align: center;
      text-decoration: none;
      color: #FFFFFF !important;
      background-color: var(--color-accent);
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      transition: background-color 0.15s ease;
      mso-padding-alt: 14px 28px;
    }
    .btn:hover { background-color: var(--color-accent-hover) !important; }
    .btn:focus { outline: 3px solid var(--color-focus); outline-offset: 2px; }
    .btn--outline {
      background-color: transparent;
      color: var(--color-accent) !important;
      border: 2px solid var(--color-accent);
    }
    .btn--outline:hover { background-color: rgba(0, 212, 170, 0.08); }
    .btn--warning { background-color: var(--color-warning); }
    .btn--full { display: block; width: 100%; box-sizing: border-box; }

    /* Badge */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.25;
      border-radius: 9999px;
    }
    .badge--success { background-color: rgba(0, 212, 170, 0.12); color: #047857; }
    .badge--warning { background-color: rgba(245, 166, 35, 0.12); color: #B45309; }
    .badge--info { background-color: rgba(59, 130, 246, 0.12); color: #1E40AF; }

    /* Lists */
    .list { margin: 0; padding: 0 0 0 var(--space-4); }
    .list li { margin-bottom: var(--space-2); }
    .list--check li { position: relative; padding-left: var(--space-3); }
    .list--check li::before {
      content: "✓";
      position: absolute;
      left: 0;
      color: var(--color-accent);
      font-weight: 600;
    }

    /* Footer */
    .footer { padding: var(--space-4); text-align: center; border-top: 1px solid var(--color-border); }
    .footer a { color: var(--color-text-muted); text-decoration: underline; }
    .footer .social { margin: var(--space-2) 0; }
    .footer .social a { display: inline-block; margin: 0 var(--space-1); }

    /* Utilities */
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .text-center { text-align: center; }
    .text-left { text-align: left; }
    .mt-1 { margin-top: var(--space-1); }
    .mt-2 { margin-top: var(--space-2); }
    .mt-3 { margin-top: var(--space-3); }
    .mt-4 { margin-top: var(--space-4); }
    .mb-1 { margin-bottom: var(--space-1); }
    .mb-2 { margin-bottom: var(--space-2); }
    .mb-3 { margin-bottom: var(--space-3); }
    .mb-4 { margin-bottom: var(--space-4); }

    /* Mobile responsive */
    @media screen and (max-width: 480px) {
      .text-base { font-size: 15px; }
      .text-lg { font-size: 16px; }
      .text-xl { font-size: 18px; }
      .section { padding: var(--space-2) var(--space-3); }
      .btn { padding: 14px 24px; font-size: 15px; }
    }

    /* Dark mode (optional - for clients that support it) */
    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #0F172A;
        --color-card: #1E293B;
        --color-text: #F1F5F9;
        --color-text-muted: #94A3B8;
        --color-border: #334155;
      }
    }
  </style>
